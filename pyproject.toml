[project]
name = "interviewiq"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn>=0.30.0,<1.0.0",
  "numpy>=2.0.0,<3.0.0",
  "opencv-python-headless>=4.10.0,<5.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "starlette>=0.40.0,<1.0.0",
  "websockets>=12.0,<16.0"
]

[tool.vercel]
entrypoint = "backend.main:app"
